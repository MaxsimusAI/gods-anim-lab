<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Анимации богов Kling — приёмка: Битва титанов и Titan Idols</title>
  <link rel="icon" type="image/webp" href="assets/ui/ports/kitsune.webp">
  <link rel="stylesheet" href="styles.css?v=96">
</head>
<body>
  <div class="app-shell">
    <!-- 1. ВЕРХНЯЯ ПАНЕЛЬ: ВКЛАДКИ (52 + 10), ФИЛЬТРЫ СТИХИЙ, ПЕРЕКЛЮЧАТЕЛЬ БОГОВ И МЕТРИКИ -->
    <header class="top-bar">
      <div class="top-row-1">
        <div class="brand-wrap">
          <span class="brand-title">Анимации Kling · приёмка по одному богу</span>
          <div class="stage-tabs" role="tablist" aria-label="Разделы богов">
            <button class="stage-tab active" id="tabExisting" data-group="existing" type="button">Существующие боги (52)</button>
            <button class="stage-tab" id="tabNew10" data-group="new10" type="button">10 новых богов «под ключ» (10)</button>
          </div>
          <div class="el-filters" id="elFilters" role="group" aria-label="Фильтр стихий"></div>
        </div>

        <div class="quick-nav">
          <button class="nav-arrow" id="btnPrevGod" type="button" title="Предыдущий бог (←)">◀</button>
          <select class="god-select" id="godQuickSelect" aria-label="Быстрый выбор бога"></select>
          <button class="nav-arrow" id="btnNextGod" type="button" title="Следующий бог (→)">▶</button>
          <button class="concept-btn" id="btnConceptModal" type="button" hidden>🔍 Арт 2K (БТ + TI)</button>
        </div>
      </div>

      <div class="god-roster" id="godRoster" role="navigation" aria-label="Список богов"></div>

      <div class="top-row-2">
        <div class="metrics-line" id="metricsLine"></div>
        <div class="toggles-wrap">
          <div class="seg-group" role="group" aria-label="Скорость просмотра">
            <span class="seg-label">Скорость:</span>
            <button class="seg-btn" data-spd="0.25" type="button">0.25×</button>
            <button class="seg-btn" data-spd="0.5" type="button">0.5×</button>
            <button class="seg-btn active" data-spd="1" type="button">1×</button>
            <button class="seg-btn" id="btnPause" type="button">⏸ Пауза</button>
          </div>
          <div class="seg-group" role="group" aria-label="Версия анимаций на аренах 2 и 3">
            <span class="seg-label">Новые арены:</span>
            <button class="seg-btn" data-ver="prev" type="button" title="Как было вчера, до переделки">вчера</button>
            <button class="seg-btn active" data-ver="now" type="button" title="Как сейчас, после переделки">новое</button>
          </div>
          <div class="seg-group" role="group" aria-label="Качество спрайта">
            <span class="seg-label">Листы:</span>
            <button class="seg-btn active" data-tier="mob" type="button">mob (≤180×220)</button>
            <button class="seg-btn" data-tier="lite" type="button">lite (≤126×154)</button>
          </div>
        </div>
      </div>
    </header>

    <!-- 2. ЦЕНТР ЭКРАНА: 3 МИНИ-АРЕНЫ СТРОГО В ОДИН РЯД -->
    <main class="arenas-grid" id="arenasGrid">
      <!-- Заполняется скриптом app.js для 3 арен: live_bt, new_bt, new_ti -->
    </main>

    <!-- 3. СИНХРОННЫЕ КНОПКИ УМЕНИЙ -->
    <nav class="controls-bar" aria-label="Управление умениями">
      <button class="skill-btn active" data-slot="idle" type="button">
        <span class="key-tag">IDLE</span>
        <span>Ожидание</span>
      </button>
      <button class="skill-btn" data-slot="atk" type="button">
        <span class="key-tag">ATK</span>
        <span id="btnAtkLabel">Обычное умение</span>
      </button>
      <button class="skill-btn" data-slot="sup" type="button">
        <span class="key-tag">SUP</span>
        <span id="btnSupLabel">Суперумение</span>
      </button>
      <button class="skill-btn" data-slot="hyp" type="button">
        <span class="key-tag">HYP</span>
        <span id="btnHypLabel">Ульта</span>
      </button>

      <div class="playback-meta">
        <button class="auto-btn" id="btnShowcase" type="button" title="Показать подряд обычное умение → супер → ульту">▶ Показ 3 умений</button>
        <button class="auto-btn" id="btnAutoCycle" type="button" title="Автоматически повторять выбранное боевое умение">↻ Автоповтор: Выкл</button>
        <span class="frame-readout" id="frameReadout">Кадр 01/25</span>
      </div>
    </nav>
    <div class="alt-bar" id="altBar" hidden></div>

    <!-- 4. ДВА ТЕКСТОВЫХ БЛОКА ПОД КНОПКАМИ: УМЕНИЕ/FX2 И БАЛАНС НА КАПЕ -->
    <section class="verdicts-grid" aria-label="Разбор умения, FX и баланса">
      <article class="verdict-card" id="blockFx">
        <div class="verdict-head">
          <span class="verdict-label" id="fxTitle">Блок А — Умение и программный эффект (FX2 «Кузница»)</span>
          <span class="status-pill keep" id="fxBadge">Подлинный FX2</span>
        </div>
        <div class="verdict-body" id="fxBody"></div>
      </article>

      <article class="verdict-card" id="blockBalance">
        <div class="verdict-head">
          <span class="verdict-label" id="balTitle">Блок Б — Баланс на максимальной прокачке (XX★5)</span>
          <span class="status-pill balanced" id="balBadge">В балансе</span>
        </div>
        <div class="verdict-body" id="balBody"></div>
      </article>
    </section>
  </div>

  <!-- Модальное окно полноразмерного сравнения 2K-артов новых богов (БТ vs Titan Idols) -->
  <div class="concept-modal" id="conceptModal" hidden>
    <div class="concept-backdrop" id="conceptBackdrop"></div>
    <div class="concept-dialog" role="dialog" aria-modal="true" aria-labelledby="conceptModalTitle">
      <div class="concept-head">
        <span class="concept-title" id="conceptModalTitle">Концепт-арт нового бога (БТ + Titan Idols)</span>
        <button class="concept-close" id="btnCloseConcept" type="button">✕ Закрыть</button>
      </div>
      <div class="concept-body" id="conceptModalBody"></div>
    </div>
  </div>

  <script src="assets/gods-data.js?v=96"></script>
  <script src="assets/sim-core.js?v=96"></script>
  <script src="assets/fx2-stand.js?v=96"></script>
  <script src="app.js?v=96"></script>
</body>
</html>
